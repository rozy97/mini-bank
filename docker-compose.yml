services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    restart: unless-stopped
    ports:
      - "16686:16686" # UI: http://localhost:16686
      - "4318:4318"   # OTLP/HTTP receiver

  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: ${PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-postgres}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_TTL: ${JWT_TTL:-24h}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-mini-bank}
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    ports:
      - "${PORT:-8080}:8080" # exposed directly too, for local debugging; nginx is the intended front door
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - app

volumes:
  postgres_data:
