# Reverse proxy in front of the Mini Bank API. Terminates the public port,
# adds a few baseline production hardenings (headers, gzip, a rate limit on
# the unauthenticated auth endpoints), and forwards everything else to app.

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_status 429;

upstream mini_bank {
    server app:8080;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    gzip on;
    gzip_types application/json;
    gzip_min_length 256;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        access_log off;
        proxy_pass http://mini_bank;
    }

    # Unauthenticated, so the most exposed to brute force / credential
    # stuffing: allow bursts of a few requests, then throttle to 5 r/s.
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://mini_bank;
    }

    location / {
        proxy_pass http://mini_bank;
    }
}
